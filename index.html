<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kashmira Mathur & Richi Mathur - Wedding Invitation</title>
    <!-- Instant Auto-Redirect to Full Wedding Invitation -->
    <meta http-equiv="refresh" content="0; url=Wedding-full/">
    <script>
        window.location.replace("Wedding-full/" + window.location.search + window.location.hash);
    </script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #faf7f2;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            color: #292524;
            box-sizing: border-box;
        }
        .card {
            background: #ffffff;
            border: 1px solid #fde68a;
            border-radius: 24px;
            padding: 32px 24px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }
        .tag {
            display: inline-block;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.25em;
            color: #92400e;
            font-weight: 700;
            background: #fef3c7;
            padding: 4px 14px;
            border-radius: 999px;
            border: 1px solid #fde68a;
            margin-bottom: 12px;
        }
        h1 {
            font-size: 22px;
            color: #6b1724;
            margin: 0 0 8px 0;
            font-weight: 700;
        }
        p {
            font-size: 13px;
            color: #78716c;
            margin: 0 0 24px 0;
        }
        .btn {
            display: block;
            text-decoration: none;
            padding: 14px 20px;
            border-radius: 16px;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 12px;
            transition: all 0.2s ease;
        }
        .btn-primary {
            background: #6b1724;
            color: #ffffff;
        }
        .btn-secondary {
            background: #fef3c7;
            color: #78350f;
            border: 1px solid #fde68a;
        }
    </style>
</head>
<body>
    <div class="card">
        <span class="tag">॥ श्री गणेशाय नमः ॥</span>
        <h1>Kashmira & Richi</h1>
        <p>Opening wedding invitation...</p>
        <a href="Wedding-full/" class="btn btn-primary">💍 All Ceremonies (Full Invitation)</a>
        <a href="wedding-only/" class="btn btn-secondary">✨ Wedding Ceremony Only</a>
    </div>
</body>
</html>
